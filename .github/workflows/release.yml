name: Build MattAMP
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mattamp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'if(process.env.GITHUB_REF_NAME!=="v"+require("./package.json").version)process.exit(1)'
      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify bundled app
        run: node scripts/verify-package.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: MattAMP-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/MattAMP-*.AppImage
            dist/MattAMP-*.deb
            dist/MattAMP-*.tar.gz
            dist/MattAMP-*.exe
            dist/MattAMP-*.dmg
            dist/MattAMP-*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MattAMP-*
          path: dist
          merge-multiple: true
      - run: node scripts/checksums.cjs
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/MattAMP-* dist/SHA256SUMS.txt --verify-tag --title "MattAMP $GITHUB_REF_NAME" --notes-file docs/release-0.2.0.md
